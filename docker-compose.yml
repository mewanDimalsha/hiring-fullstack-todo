services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: todo_server
    ports:
      - '5001:5001'
    env_file:
      - .env          # reads from ROOT .env file
    environment:
      - PORT=5001

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: todo_client
    ports:
      - '5173:80'
    depends_on:
      - server